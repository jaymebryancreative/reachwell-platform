<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reachwell — Connected Platform Preview</title><style>:root{--ink:#111827;--muted:#667085;--line:#e6e7ee;--bg:#f6f6fb;--p:#7257ff;--p2:#a855f7;--pink:#ef7fd5;--card:#fff}*{box-sizing:border-box}body{margin:0;font:16px/1.45 Inter,ui-sans-serif,system-ui;background:radial-gradient(circle at 90% 0,#e9e2ff,transparent 30%),var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:275px 1fr}.side{background:linear-gradient(180deg,#111827,#18213a 65%,#2d235b);color:#d8dcea;padding:18px 14px;position:sticky;top:0;height:100vh}.brand{font-size:28px;font-weight:900;color:#fff;padding:12px}.org{margin:14px 8px;padding:14px;border:1px solid #ffffff20;border-radius:18px;background:#ffffff0d;cursor:pointer}.org small{display:block;color:#aeb6c9}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d8dcea;text-align:left;padding:13px 15px;border-radius:15px;font-size:16px;font-weight:700;cursor:pointer}.nav button:hover{background:#ffffff10}.nav button.active{color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 12px 28px #7257ff55}.top{position:sticky;top:0;z-index:5;min-height:78px;padding:12px 28px;background:#fffffff0;backdrop-filter:blur(15px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.modebar{display:flex;gap:12px;flex-wrap:wrap}.switch{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#fff;border:1px solid #e4ddff;border-radius:999px;box-shadow:0 5px 18px #1118270b;font-weight:800}.switch input{appearance:none;width:43px;height:24px;border-radius:99px;background:#cfd3dc;position:relative;cursor:pointer;transition:.2s}.switch input:before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s;box-shadow:0 1px 4px #0003}.switch input:checked{background:linear-gradient(90deg,var(--p),var(--p2))}.switch input:checked:before{left:22px}.content{max-width:1500px;margin:auto;padding:30px}.page{display:none}.page.active{display:block}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.hero h1{font-size:35px;letter-spacing:-1px;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:linear-gradient(145deg,#fff,#fbfaff);border:1px solid var(--line);border-radius:24px;padding:21px;margin:16px 0;box-shadow:0 12px 35px #1f29370b}.card h2,.card h3{margin-top:0}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin:9px 0;cursor:pointer;transition:.18s}.item:hover{transform:translateY(-1px);border-color:#b7a9ff;box-shadow:0 10px 24px #7257ff12}.btn{border:0;border-radius:14px;padding:11px 16px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 20px #7257ff30}.btn.secondary{background:#f0eff7;color:#302b58;box-shadow:none}.btn.danger{background:linear-gradient(135deg,#e5484d,#f06a6f)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.toolbar input,.toolbar select{width:auto;min-width:190px;flex:1}input,select,textarea{width:100%;border:1px solid #dfe1e8;border-radius:13px;padding:11px;background:#fff;margin:4px 0 10px}.row{display:flex;gap:12px}.row>*{flex:1}.progress{height:12px;background:#ecebf3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2),var(--pink))}.stat{font-size:30px;font-weight:900}.chip{display:inline-block;padding:5px 9px;border-radius:999px;background:#f0edff;color:#5543c5;font-size:13px;font-weight:800;margin:2px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:1px solid #dedbe9;background:#fff;border-radius:13px;padding:9px 13px;cursor:pointer}.tabs button.active{background:linear-gradient(135deg,#eeeaff,#faeafa);border-color:#b9aaff;color:#513ac8;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#10182799;z-index:20;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.dialog{background:#fff;border-radius:28px;padding:24px;width:min(850px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 90px #0005}.close{float:right;border:0;border-radius:11px;padding:8px;background:#f0f1f6;cursor:pointer}.kpi{background:linear-gradient(135deg,#fff,#f6f1ff);border:1px solid #e4ddff;border-radius:21px;padding:18px}.hidden{display:none!important}.right{margin-left:auto}.small{font-size:13px}@media(max-width:900px){.app{display:block}.side{height:auto;position:static}.brand,.org{display:inline-block}.nav{display:flex;overflow:auto;padding-top:8px}.nav button{min-width:max-content}.grid,.grid3{grid-template-columns:1fr}.content{padding:18px 14px}.top{padding:10px 14px;align-items:flex-start}.hero h1{font-size:29px}.modebar{gap:7px}.switch{font-size:14px;padding:8px 10px}.row{flex-direction:column}}</style><body><div class="app"><aside class="side"><div class="brand">✦ Reachwell</div><div class="org" onclick="go('organization')"><b id="orgName">Hope Community Outreach</b><small>Organization details & administration</small></div><div class="nav" id="nav"></div></aside><main><header class="top"><b id="title">Today</b><div class="modebar"><label class="switch">Mission Mode <input id="missionToggle" type="checkbox"></label><label class="switch">Sign-In Mode <input id="signinToggle" type="checkbox"></label></div></header><section class="content" id="pages"></section></main></div><div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div><script>const KEY='reachwell-v4';const nav=['Today','People','Teams','Communication','Events','Mission','Workspace','Giving & Finance','Impact','Settings','Data Center'];const ids=['today','people','teams','communication','events','mission','workspace','finance','impact','settings','data'];let S=JSON.parse(localStorage.getItem(KEY)||'null')||{org:{name:'Hope Community Outreach',mission:'Serving people. Strengthening communities.'},people:[{id:1,first:'Sarah',middle:'',last:'Johnson',preferred:'Sarah',birthday:'1990-05-14',marital:'Married',email:'sarah@hope.org',phone:'555-0101',address:'101 Hope Lane',teamIds:[1],role:'Outreach Leader',skills:'Follow-up, prayer, hospitality',availability:'Weekdays after 5 PM',emergency:'John Johnson · 555-0109',tags:'leader,outreach',served:18,history:['Oak Street Outreach','Community Dinner'],notes:'Strong follow-up leader.',archived:false},{id:2,first:'Michael',last:'Davis',birthday:'1987-11-02',marital:'Single',email:'michael@hope.org',phone:'555-0102',address:'',teamIds:[2],role:'Volunteer',skills:'Setup, logistics',availability:'Saturdays',emergency:'',tags:'events',served:11,history:['Community Dinner'],notes:'',archived:false}],teams:[{id:1,name:'Community Outreach',purpose:'Outreach, follow-up and community care',leaderId:1,memberIds:[1]},{id:2,name:'Event Setup',purpose:'Events and gatherings',leaderId:2,memberIds:[2]}],channels:[{id:1,name:'Community Outreach',type:'Team',members:[1],messages:[{text:'Welcome to the outreach channel.',at:'Today'}]},{id:2,name:'Organization Announcements',type:'Announcement',members:[],messages:[{text:'Welcome to Reachwell.',at:'Today'}]}],events:[{id:1,name:'Community Dinner',date:'2026-09-05',location:'Community Center',teamId:2,roster:[1,2],status:'Upcoming'}],attendance:{},mission:[{id:1,name:'101 Oak Street',teamId:1,done:false,fields:{note:'',need:'',prayer:''}},{id:2,name:'103 Oak Street',teamId:1,done:false,fields:{note:'',need:'',prayer:''}},{id:3,name:'105 Oak Street',teamId:1,done:false,fields:{note:'',need:'',prayer:''}}],projects:[{id:1,name:'Community Dinner Launch',teamId:2,eventId:1,status:'Active'}],tasks:[{id:1,name:'Confirm volunteers',projectId:1,teamId:2,assigneeId:2,status:'To Do',priority:'High',due:'2026-09-01'},{id:2,name:'Prepare outreach materials',projectId:null,teamId:1,assigneeId:1,status:'In Progress',priority:'Normal',due:'2026-08-31'}],gifts:[{id:1,donor:'Sample Donor',amount:250,fund:'General',date:'2026-08-27',method:'Check'}],expenses:[{id:1,vendor:'Community Supplies',amount:72.5,category:'Outreach',date:'2026-08-26'}],budget:{General:5000,Outreach:1500},files:[{id:1,name:'Volunteer Guide.pdf',type:'Document'}],settings:{notifications:true,email:true,retention:'Standard'}};let current='today',channelId=1,assignment=0,field='note';const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function age(d){if(!d)return'—';let b=new Date(d),n=new Date(),a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a}function personName(p){return [p.preferred||p.first,p.last].filter(Boolean).join(' ')}function teamName(id){return S.teams.find(t=>t.id==id)?.name||'Unassigned'}function renderShell(){nav.innerHTML=nav.map((n,i)=>`<button class="${ids[i]===current?'active':''}" onclick="go('${ids[i]}')">${n}</button>`).join('');orgName.textContent=S.org.name}function go(p){current=p;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));let el=$(p);if(el)el.classList.add('active');title.textContent=p==='signin'?'Sign-In Mode':nav[ids.indexOf(p)]||p;renderShell();renderPage(p)}function renderPage(p){const f={today:today,people:people,teams:teams,communication:communication,events:events,mission:mission,workspace:workspace,finance:finance,impact:impact,settings:settings,data:data,organization:organization,signin:signin};(f[p]||today)()}function page(id,html){pages.innerHTML=`<div id="${id}" class="page active">${html}</div>`}function today(){let gifts=S.gifts.reduce((a,g)=>a+Number(g.amount),0);page('today',`<div class="hero"><div><h1>Your connected organization workspace</h1><p class="muted">People, teams, events, communication, field work and records working together.</p></div><button class="btn" onclick="openEvent()">+ Create event</button></div><div class="grid3"><div class="kpi"><div class="muted">People</div><div class="stat">${S.people.filter(p=>!p.archived).length}</div></div><div class="kpi"><div class="muted">Upcoming events</div><div class="stat">${S.events.filter(e=>e.status!=='Complete').length}</div></div><div class="kpi"><div class="muted">Giving recorded</div><div class="stat">$${gifts.toFixed(0)}</div></div></div><div class="grid"><div class="card"><h2>Today’s attention</h2><div class="item" onclick="go('people')"><b>People & follow-up</b><div class="muted">Review profiles, serving and care records</div></div><div class="item" onclick="go('events')"><b>Event readiness</b><div class="muted">Rosters, teams and attendance</div></div></div><div class="card"><h2>Your teams</h2>${S.teams.map(t=>`<div class="item" onclick="openTeam(${t.id})"><b>${esc(t.name)}</b><div class="muted">${t.memberIds.length} members · ${esc(t.purpose)}</div></div>`).join('')}</div></div>`)}function people(){page('people',`<div class="hero"><div><h1>People</h1><p class="muted">Complete profiles, households, serving, attendance and connected communication.</p></div><button class="btn" onclick="openPerson()">+ Add person</button></div><div class="toolbar"><input id="q" placeholder="Search name, email, team, skill or tag" oninput="renderPeople()"><select id="tf" onchange="renderPeople()"><option value="">All teams</option>${S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button class="btn secondary" onclick="renderPeople(true)">Archived</button></div><div id="peopleList"></div>`);renderPeople()}function renderPeople(arch=false){let q=($('q')?.value||'').toLowerCase(),tf=$('tf')?.value||'';let list=S.people.filter(p=>!!p.archived===arch).filter(p=>JSON.stringify(p).toLowerCase().includes(q)&&(!tf||p.teamIds?.includes(+tf)));peopleList.innerHTML=list.map(p=>`<div class="item" onclick="openPerson(${p.id})"><b>${esc(personName(p))}</b> <span class="chip">${esc(p.role||'Member')}</span><div class="muted">${p.teamIds?.map(teamName).join(', ')||'Unassigned'} · ${age(p.birthday)} years old · Served ${p.served||0} times</div><div class="small muted">${esc(p.email||'No email')} · ${esc(p.phone||'No phone')}</div></div>`).join('')||'<div class="card muted">No matching people.</div>'}function openPerson(id){let p=S.people.find(x=>x.id===id)||{teamIds:[],archived:false};modalContent.innerHTML=`<h2>${id?'Edit':'Add'} person</h2><div class="row"><label>First name<input id="pf" value="${esc(p.first||'')}"></label><label>Middle name<input id="pm" value="${esc(p.middle||'')}"></label><label>Last name<input id="pl" value="${esc(p.last||'')}"></label></div><div class="row"><label>Preferred name<input id="pp" value="${esc(p.preferred||'')}"></label><label>Birthday<input id="pb" type="date" value="${esc(p.birthday||'')}"></label><label>Marital status<select id="ps"><option>${esc(p.marital||'Select')}</option><option>Single</option><option>Married</option><option>Divorced</option><option>Widowed</option></select></label></div><div class="row"><label>Email<input id="pe" type="email" value="${esc(p.email||'')}"></label><label>Phone<input id="ph" value="${esc(p.phone||'')}"></label></div><label>Address<input id="pa" value="${esc(p.address||'')}"></label><label>Teams<select id="pt" multiple size="${Math.max(3,S.teams.length)}">${S.teams.map(t=>`<option value="${t.id}" ${p.teamIds?.includes(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><div class="row"><label>Role<input id="pr" value="${esc(p.role||'Volunteer')}"></label><label>Tags<input id="pg" value="${esc(p.tags||'')}"></label></div><label>Skills / interests<textarea id="pk">${esc(p.skills||'')}</textarea></label><label>Availability<textarea id="pv">${esc(p.availability||'')}</textarea></label><label>Emergency contact<input id="pc" value="${esc(p.emergency||'')}"></label><label>Serving notes<textarea id="pn">${esc(p.notes||'')}</textarea></label><div class="toolbar"><button class="btn" onclick="savePerson(${id||0})">Save profile</button>${id?`<button class="btn secondary" onclick="messagePerson(${id})">Message</button><button class="btn secondary" onclick="addFollowup(${id})">Create follow-up</button><button class="btn danger" onclick="archivePerson(${id})">${p.archived?'Restore':'Archive'}</button>`:''}</div>${id?`<div class="card"><h3>Serving & event history</h3>${(p.history||[]).map(x=>`<div class="item">${esc(x)}</div>`).join('')||'<span class="muted">No history yet.</span>'}</div>`:''}`;modal.classList.add('show')}function savePerson(id){let p=id?S.people.find(x=>x.id===id):{id:Date.now(),served:0,history:[]};Object.assign(p,{first:pf.value.trim(),middle:pm.value.trim(),last:pl.value.trim(),preferred:pp.value.trim(),birthday:pb.value,marital:ps.value,email:pe.value.trim(),phone:ph.value.trim(),address:pa.value.trim(),teamIds:[...pt.selectedOptions].map(o=>+o.value),role:pr.value.trim(),tags:pg.value.trim(),skills:pk.value.trim(),availability:pv.value.trim(),emergency:pc.value.trim(),notes:pn.value.trim()});if(!p.first||!p.last)return alert('First and last name are required.');if(!id)S.people.push(p);syncMemberships(p);save();closeModal();renderPage('people')}function syncMemberships(p){S.teams.forEach(t=>t.memberIds=t.memberIds.filter(id=>id!==p.id));p.teamIds.forEach(id=>{let t=S.teams.find(x=>x.id===id);if(t&&!t.memberIds.includes(p.id))t.memberIds.push(p.id)})}function archivePerson(id){let p=S.people.find(x=>x.id===id);p.archived=!p.archived;save();closeModal();renderPage('people')}function messagePerson(id){let p=S.people.find(x=>x.id===id),c={id:Date.now(),name:personName(p),type:'Direct',members:[id],messages:[]};S.channels.push(c);channelId=c.id;save();closeModal();go('communication')}function addFollowup(id){let p=S.people.find(x=>x.id===id);p.history.push('Follow-up created — '+new Date().toLocaleDateString());save();alert('Follow-up added to this person’s record.')}function teams(){page('teams',`<div class="hero"><div><h1>Teams & Ministry Groups</h1><p class="muted">People, leaders, communication, events and work connected to each team.</p></div><button class="btn" onclick="openTeam()">+ Create team</button></div><div class="toolbar"><input id="tq" placeholder="Search teams" oninput="renderTeams()"></div><div id="teamsList"></div>`);renderTeams()}function renderTeams(){let q=($('tq')?.value||'').toLowerCase();teamsList.innerHTML=S.teams.filter(t=>t.name.toLowerCase().includes(q)).map(t=>`<div class="item" onclick="openTeam(${t.id})"><b>${esc(t.name)}</b><div class="muted">${t.memberIds.length} members · ${esc(t.purpose)}</div></div>`).join('')}function openTeam(id){let t=S.teams.find(x=>x.id===id)||{memberIds:[]};modalContent.innerHTML=`<h2>${id?'Manage':'Create'} team</h2><label>Team name<input id="tn" value="${esc(t.name||'')}"></label><label>Purpose<textarea id="tp">${esc(t.purpose||'')}</textarea></label><label>Team leader<select id="tl"><option value="">Unassigned</option>${S.people.filter(p=>!p.archived).map(p=>`<option value="${p.id}" ${t.leaderId===p.id?'selected':''}>${esc(personName(p))}</option>`).join('')}</select></label><label>Members<select id="tm" multiple size="6">${S.people.filter(p=>!p.archived).map(p=>`<option value="${p.id}" ${t.memberIds.includes(p.id)?'selected':''}>${esc(personName(p))}</option>`).join('')}</select></label><div class="toolbar"><button class="btn" onclick="saveTeam(${id||0})">Save team</button>${id?`<button class="btn secondary" onclick="openTeamChannel(${id})">Open communication</button>`:''}</div>`;modal.classList.add('show')}function saveTeam(id){let t=id?S.teams.find(x=>x.id===id):{id:Date.now()};Object.assign(t,{name:tn.value.trim(),purpose:tp.value.trim(),leaderId:+tl.value||null,memberIds:[...tm.selectedOptions].map(o=>+o.value)});if(!t.name)return alert('Team name is required.');if(!id){S.teams.push(t);S.channels.push({id:Date.now(),name:t.name,type:'Team',members:t.memberIds,messages:[]})}S.people.forEach(p=>{p.teamIds=p.teamIds||[];p.teamIds=p.teamIds.filter(x=>x!==t.id);if(t.memberIds.includes(p.id))p.teamIds.push(t.id)});save();closeModal();renderPage('teams')}function openTeamChannel(id){let t=S.teams.find(x=>x.id===id),c=S.channels.find(c=>c.type==='Team'&&c.name===t.name);if(!c){c={id:Date.now(),name:t.name,type:'Team',members:t.memberIds,messages:[]};S.channels.push(c)}channelId=c.id;save();closeModal();go('communication')}function communication(){page('communication',`<div class="hero"><div><h1>Communication</h1><p class="muted">Organization announcements, teams, events, projects, groups and direct conversations.</p></div><button class="btn" onclick="openChannel()">+ New conversation</button></div><div class="grid"><div class="card"><h2>Conversations</h2><div id="channelList"></div></div><div class="card"><h2 id="channelTitle"></h2><div id="messages"></div><textarea id="messageText" rows="4" placeholder="Write a message"></textarea><div class="toolbar"><button class="btn" onclick="sendMessage()">Send</button><button class="btn secondary" onclick="emailInfo()">Compose email</button></div></div></div>`);renderCommunication()}function renderCommunication(){let c=S.channels.find(x=>x.id===channelId)||S.channels[0];channelId=c.id;channelList.innerHTML=S.channels.map(x=>`<div class="item ${x.id===channelId?'chip':''}" onclick="channelId=${x.id};renderCommunication()"><b>${esc(x.name)}</b><div class="muted small">${x.type} · ${x.messages.length} messages</div></div>`).join('');channelTitle.textContent=c.name;messages.innerHTML=c.messages.map(m=>`<div class="item"><b>${esc(m.author||'Reachwell')}</b><div>${esc(m.text)}</div><div class="small muted">${esc(m.at||'')}</div></div>`).join('')||'<p class="muted">Start the conversation.</p>'}function openChannel(){modalContent.innerHTML=`<h2>New conversation</h2><label>Name<input id="cn"></label><label>Type<select id="ct"><option>Group</option><option>Direct</option><option>Announcement</option></select></label><label>Participants<select id="cm" multiple size="6">${S.people.filter(p=>!p.archived).map(p=>`<option value="${p.id}">${esc(personName(p))}</option>`).join('')}</select></label><button class="btn" onclick="saveChannel()">Create conversation</button>`;modal.classList.add('show')}function saveChannel(){let c={id:Date.now(),name:cn.value.trim(),type:ct.value,members:[...cm.selectedOptions].map(o=>+o.value),messages:[]};if(!c.name)return alert('Name is required.');S.channels.push(c);channelId=c.id;save();closeModal();renderPage('communication')}function sendMessage(){let c=S.channels.find(x=>x.id===channelId),v=messageText.value.trim();if(!v)return;c.messages.push({text:v,author:'You',at:new Date().toLocaleString()});save();renderCommunication()}function emailInfo(){alert('Email composition is represented here. Production delivery must use a configured provider, sender identity, preferences/consent, delivery status and an organization-scoped communication record.')}function events(){page('events',`<div class="hero"><div><h1>Events</h1><p class="muted">Planning, teams, rosters, communication, sign-in and follow-up.</p></div><button class="btn" onclick="openEvent()">+ Create event</button></div><div id="eventList"></div>`);renderEvents()}function renderEvents(){eventList.innerHTML=S.events.map(e=>`<div class="item" onclick="openEvent(${e.id})"><b>${esc(e.name)}</b><div class="muted">${esc(e.date)} · ${esc(e.location||'No location')} · ${teamName(e.teamId)} · ${e.roster.length} rostered</div><span class="chip">${esc(e.status)}</span></div>`).join('')}function openEvent(id){let e=S.events.find(x=>x.id===id)||{roster:[],status:'Upcoming'};modalContent.innerHTML=`<h2>${id?'Manage':'Create'} event</h2><label>Event name<input id="en" value="${esc(e.name||'')}"></label><div class="row"><label>Date<input id="ed" type="date" value="${esc(e.date||'')}"></label><label>Status<select id="es"><option ${e.status==='Upcoming'?'selected':''}>Upcoming</option><option ${e.status==='Complete'?'selected':''}>Complete</option><option ${e.status==='Cancelled'?'selected':''}>Cancelled</option></select></label></div><label>Location<input id="el" value="${esc(e.location||'')}"></label><label>Primary team<select id="et"><option value="">Unassigned</option>${S.teams.map(t=>`<option value="${t.id}" ${e.teamId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label>Roster<select id="er" multiple size="7">${S.people.filter(p=>!p.archived).map(p=>`<option value="${p.id}" ${e.roster.includes(p.id)?'selected':''}>${esc(personName(p))}</option>`).join('')}</select></label><div class="toolbar"><button class="btn" onclick="saveEvent(${id||0})">Save event</button>${id?`<button class="btn secondary" onclick="openEventChannel(${id})">Event communication</button>`:''}</div>`;modal.classList.add('show')}function saveEvent(id){let e=id?S.events.find(x=>x.id===id):{id:Date.now()};Object.assign(e,{name:en.value.trim(),date:ed.value,status:es.value,location:el.value.trim(),teamId:+et.value||null,roster:[...er.selectedOptions].map(o=>+o.value)});if(!e.name)return alert('Event name is required.');if(!id)S.events.push(e);save();closeModal();renderPage('events')}function openEventChannel(id){let e=S.events.find(x=>x.id===id),c=S.channels.find(c=>c.type==='Event'&&c.eventId===id);if(!c){c={id:Date.now(),name:e.name+' — Event',type:'Event',eventId:id,members:e.roster,messages:[]};S.channels.push(c)}channelId=c.id;save();closeModal();go('communication')}function mission(){let m=S.mission[assignment]||S.mission[0],done=S.mission.filter(x=>x.done).length,p=Math.round(done/S.mission.length*100);page('mission',`<div class="hero"><div><h1>Mission Mode</h1><p class="muted">Touch-friendly field workflow for outreach and door-to-door ministry.</p></div><span class="chip">${done}/${S.mission.length} complete · ${p}%</span></div><div class="grid"><div class="card"><h2>${esc(m.name)}</h2><div class="tabs"><button class="${field==='note'?'active':''}" onclick="setField('note')">Note</button><button class="${field==='need'?'active':''}" onclick="setField('need')">Need</button><button class="${field==='prayer'?'active':''}" onclick="setField('prayer')">Prayer</button></div><textarea id="missionText" rows="7" oninput="saveMissionText()">${esc(m.fields[field])}</textarea><div class="toolbar"><button class="btn" onclick="completeAssignment()">Complete assignment</button><button class="btn secondary" onclick="nextAssignment(-1)">Previous</button><button class="btn secondary" onclick="nextAssignment(1)">Next</button></div></div><div class="card"><h2>Mission progress</h2><div class="progress"><i style="width:${p}%"></i></div><h3>${p}% overall</h3>${S.teams.map(t=>`<p><b>${esc(t.name)}</b> — ${Math.round(S.mission.filter(m=>m.teamId===t.id&&m.done).length/Math.max(1,S.mission.filter(m=>m.teamId===t.id).length)*100)}%</p><div class="progress"><i style="width:${Math.round(S.mission.filter(m=>m.teamId===t.id&&m.done).length/Math.max(1,S.mission.filter(m=>m.teamId===t.id).length)*100)}%"></i></div>`).join('')}</div></div>`)}function saveMissionText(){S.mission[assignment].fields[field]=missionText.value;save()}function setField(f){saveMissionText();field=f;renderPage('mission')}function completeAssignment(){saveMissionText();S.mission[assignment].done=true;save();if(assignment<S.mission.length-1)assignment++;renderPage('mission')}function nextAssignment(d){saveMissionText();assignment=Math.max(0,Math.min(S.mission.length-1,assignment+d));renderPage('mission')}function signin(){let e=S.events[0];page('signin',`<div class="hero"><div><h1>Sign-In Mode</h1><p class="muted">Select an event, review profiles and record attendance with reasons.</p></div></div><select id="se" onchange="renderSignin()">${S.events.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><div id="attendanceList"></div>`);renderSignin()}function renderSignin(){let e=S.events.find(x=>x.id==($('se')?.value||S.events[0]?.id));attendanceList.innerHTML=(e?.roster||[]).map(id=>{let p=S.people.find(x=>x.id===id),a=S.attendance[e.id+'-'+id];return `<div class="item"><b>${esc(personName(p))}</b><div class="muted">${esc(p.role||'Member')} · ${p.teamIds.map(teamName).join(', ')}</div><div class="toolbar"><button class="btn secondary" onclick="setAttendance(${e.id},${id},'Present')">Present</button><button class="btn secondary" onclick="setAttendance(${e.id},${id},'Late')">Late</button><button class="btn secondary" onclick="setAttendance(${e.id},${id},'Not Present')">Not present</button></div>${a?`<span class="chip">${esc(a.status)}${a.reason?' · '+esc(a.reason):''}</span>`:''}</div>`}).join('')||'<div class="card muted">No one is rostered for this event.</div>'}function setAttendance(e,p,status){let reason='';if(status==='Not Present')reason=prompt('Reason (you may type a custom answer):')||'';S.attendance[e+'-'+p]={status,reason,at:new Date().toISOString()};let person=S.people.find(x=>x.id===p);if(status==='Present'){person.served=(person.served||0)+1;person.history.push(S.events.find(x=>x.id===e).name+' — '+new Date().toLocaleDateString())}save();renderSignin()}function workspace(){page('workspace',`<div class="hero"><div><h1>Workspace</h1><p class="muted">Simple project management connected to people, teams and events.</p></div><div class="toolbar"><button class="btn secondary" onclick="openProject()">+ Project</button><button class="btn" onclick="openTask()">+ Task</button></div></div><div class="grid3">${['To Do','In Progress','Complete'].map(s=>`<div class="card"><h3>${s}</h3>${S.tasks.filter(t=>t.status===s).map(t=>`<div class="item" onclick="openTask(${t.id})"><b>${esc(t.name)}</b><div class="muted">${teamName(t.teamId)} · ${esc(t.priority)}${t.due?' · Due '+esc(t.due):''}</div></div>`).join('')||'<span class="muted">No tasks</span>'}</div>`).join('')}</div>`)}function openProject(){modalContent.innerHTML=`<h2>Create project</h2><label>Name<input id="pnm"></label><label>Team<select id="pteam"><option value="">Unassigned</option>${S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label><label>Event<select id="pev"><option value="">None</option>${S.events.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label><button class="btn" onclick="saveProject()">Create project</button>`;modal.classList.add('show')}function saveProject(){S.projects.push({id:Date.now(),name:pnm.value.trim(),teamId:+pteam.value||null,eventId:+pev.value||null,status:'Active'});save();closeModal();renderPage('workspace')}function openTask(id){let t=S.tasks.find(x=>x.id===id)||{};modalContent.innerHTML=`<h2>${id?'Edit':'Create'} task</h2><label>Task<input id="tan" value="${esc(t.name||'')}"></label><div class="row"><label>Status<select id="tas">${['To Do','In Progress','Complete'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Priority<select id="tap"><option>Low</option><option ${t.priority==='Normal'?'selected':''}>Normal</option><option ${t.priority==='High'?'selected':''}>High</option></select></label></div><label>Due date<input id="tad" type="date" value="${esc(t.due||'')}"></label><label>Team<select id="tat"><option value="">Unassigned</option>${S.teams.map(x=>`<option value="${x.id}" ${t.teamId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Assignee<select id="taa"><option value="">Unassigned</option>${S.people.filter(p=>!p.archived).map(x=>`<option value="${x.id}" ${t.assigneeId===x.id?'selected':''}>${esc(personName(x))}</option>`).join('')}</select></label><button class="btn" onclick="saveTask(${id||0})">Save task</button>`;modal.classList.add('show')}function saveTask(id){let t=id?S.tasks.find(x=>x.id===id):{id:Date.now()};Object.assign(t,{name:tan.value.trim(),status:tas.value,priority:tap.value,due:tad.value,teamId:+tat.value||null,assigneeId:+taa.value||null});if(!t.name)return alert('Task name is required.');if(!id)S.tasks.push(t);save();closeModal();renderPage('workspace')}function finance(){let income=S.gifts.reduce((a,x)=>a+Number(x.amount),0),spent=S.expenses.reduce((a,x)=>a+Number(x.amount),0);page('finance',`<div class="hero"><div><h1>Giving & Finance</h1><p class="muted">Detailed records, restricted access, budgets, spending and reporting.</p></div><div class="toolbar"><button class="btn" onclick="openGift()">+ Record gift</button><button class="btn secondary" onclick="openExpense()">+ Record expense</button></div></div><div class="grid3"><div class="kpi"><div class="muted">Giving</div><div class="stat">$${income.toFixed(2)}</div></div><div class="kpi"><div class="muted">Spending</div><div class="stat">$${spent.toFixed(2)}</div></div><div class="kpi"><div class="muted">Net recorded</div><div class="stat">$${(income-spent).toFixed(2)}</div></div></div><div class="grid"><div class="card"><h2>Giving records</h2>${S.gifts.map(g=>`<div class="item"><b>${esc(g.donor)}</b> — $${Number(g.amount).toFixed(2)}<div class="muted">${esc(g.fund)} · ${esc(g.method)} · ${esc(g.date)}</div></div>`).join('')}</div><div class="card"><h2>Budgets & spending</h2>${Object.entries(S.budget).map(([k,v])=>`<div class="item"><b>${esc(k)}</b><div class="muted">Budget: $${Number(v).toFixed(2)}</div></div>`).join('')}<h3>Recent spending</h3>${S.expenses.map(x=>`<div class="item">${esc(x.vendor)} — $${Number(x.amount).toFixed(2)}<div class="muted">${esc(x.category)} · ${esc(x.date)}</div></div>`).join('')}<button class="btn secondary" onclick="alert('Tap to pay and online donations require an approved payment provider, organization onboarding and production compliance review.')">Payment & Tap-to-Pay setup</button></div></div>`)}function openGift(){modalContent.innerHTML=`<h2>Record gift</h2><label>Donor / giver<input id="gd"></label><div class="row"><label>Amount<input id="ga" type="number" min="0" step="0.01"></label><label>Fund<select id="gf"><option>General</option><option>Outreach</option><option>Events</option></select></label></div><div class="row"><label>Date<input id="gdt" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Method<select id="gm"><option>Cash</option><option>Check</option><option>Card</option><option>Online</option></select></label></div><button class="btn" onclick="saveGift()">Save gift</button>`;modal.classList.add('show')}function saveGift(){S.gifts.push({id:Date.now(),donor:gd.value.trim()||'Anonymous',amount:+ga.value||0,fund:gf.value,date:gdt.value,method:gm.value});save();closeModal();renderPage('finance')}function openExpense(){modalContent.innerHTML=`<h2>Record expense</h2><label>Vendor<input id="evendor"></label><div class="row"><label>Amount<input id="ea" type="number" step="0.01"></label><label>Category<select id="ec"><option>General</option><option>Outreach</option><option>Events</option></select></label></div><label>Date<input id="edt" type="date" value="${new Date().toISOString().slice(0,10)}"></label><button class="btn" onclick="saveExpense()">Save expense</button>`;modal.classList.add('show')}function saveExpense(){S.expenses.push({id:Date.now(),vendor:evendor.value.trim(),amount:+ea.value||0,category:ec.value,date:edt.value});save();closeModal();renderPage('finance')}function impact(){let attendance=Object.values(S.attendance).filter(x=>x.status==='Present').length;page('impact',`<div class="hero"><div><h1>Impact</h1><p class="muted">A simple view of participation, serving, attendance and mission progress.</p></div></div><div class="grid3"><div class="kpi"><div class="muted">Service records</div><div class="stat">${S.people.reduce((a,p)=>a+(p.served||0),0)}</div></div><div class="kpi"><div class="muted">Recorded attendance</div><div class="stat">${attendance}</div></div><div class="kpi"><div class="muted">Mission complete</div><div class="stat">${Math.round(S.mission.filter(m=>m.done).length/Math.max(1,S.mission.length)*100)}%</div></div></div>`)}function settings(){page('settings',`<div class="hero"><div><h1>Settings</h1><p class="muted">Organization administration with a clean, focused control-center experience.</p></div></div><div class="grid"><div class="card"><h2>Organization</h2><div class="item" onclick="go('organization')">Organization profile & mission</div><div class="item" onclick="alert('Member invitations and roles are represented by the backend architecture; production UI wiring remains a deployment task.')">Members & invitations</div><div class="item" onclick="go('teams')">Teams & ministry groups</div></div><div class="card"><h2>Access & Security</h2><div class="item">Roles & granular permissions</div><div class="item">Security & recovery</div><div class="item">Audit history</div></div><div class="card"><h2>Communication</h2><label class="switch">Notifications <input type="checkbox" ${S.settings.notifications?'checked':''} onchange="S.settings.notifications=this.checked;save()"></label><label class="switch">Email enabled <input type="checkbox" ${S.settings.email?'checked':''} onchange="S.settings.email=this.checked;save()"></label></div><div class="card"><h2>Data</h2><div class="item" onclick="go('data')">Files & deletion permissions</div><div class="item" onclick="exportPreview()">Export & continuity</div><label>Retention<select onchange="S.settings.retention=this.value;save()"><option>${esc(S.settings.retention)}</option><option>Extended</option><option>Custom</option></select></label></div></div>`)}function organization(){page('organization',`<div class="hero"><div><h1>${esc(S.org.name)}</h1><p class="muted">Organization details and administrative identity.</p></div><button class="btn" onclick="editOrg()">Edit organization</button></div><div class="card"><h2>Mission</h2><p>${esc(S.org.mission)}</p><p class="muted">${S.people.length} records · ${S.teams.length} teams · ${S.events.length} events</p></div>`)}function editOrg(){modalContent.innerHTML=`<h2>Edit organization</h2><label>Name<input id="on" value="${esc(S.org.name)}"></label><label>Mission<textarea id="om">${esc(S.org.mission)}</textarea></label><button class="btn" onclick="S.org={name:on.value.trim(),mission:om.value.trim()};save();closeModal();renderShell();renderPage('organization')">Save</button>`;modal.classList.add('show')}function data(){page('data',`<div class="hero"><div><h1>Data Center</h1><p class="muted">Files, exports and organization continuity tools.</p></div><button class="btn" onclick="addFile()">+ Add file record</button></div><div class="grid"><div class="card"><h2>Organization files</h2>${S.files.map(f=>`<div class="item"><b>${esc(f.name)}</b><div class="muted">${esc(f.type)}</div><button class="btn danger small" onclick="deleteFile(${f.id})">Delete</button></div>`).join('')||'<p class="muted">No files.</p>'}</div><div class="card"><h2>Continuity & exports</h2><p>Organizations should be able to print/download important records before cancellation or non-renewal.</p><button class="btn" onclick="exportPreview()">Generate preview export</button><p class="small muted">Production exports must be generated from authorized organization-scoped backend records.</p></div></div>`)}function addFile(){let n=prompt('File name');if(n){S.files.push({id:Date.now(),name:n,type:'Document'});save();renderPage('data')}}function deleteFile(id){if(confirm('Delete this file record?')){S.files=S.files.filter(f=>f.id!==id);save();renderPage('data')}}function exportPreview(){let out={organization:S.org,people:S.people,teams:S.teams,events:S.events,giving:S.gifts,expenses:S.expenses};let blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='reachwell-organization-export.json';a.click();URL.revokeObjectURL(a.href)}function closeModal(){modal.classList.remove('show')}missionToggle.onchange=()=>{if(missionToggle.checked){signinToggle.checked=false;go('mission')}else go('today')};signinToggle.onchange=()=>{if(signinToggle.checked){missionToggle.checked=false;go('signin')}else go('today')};renderShell();today();</script></body></html>
