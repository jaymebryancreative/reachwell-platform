<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reachwell — Comprehensive Preview</title><style>:root{--p:#7257ff;--p2:#a855f7;--pink:#ef7fd5;--ink:#111827}*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f6f6fb;color:var(--ink)}.app{min-height:100vh;display:grid;grid-template-columns:275px 1fr}.side{background:linear-gradient(180deg,#111827,#18213a 65%,#2d235b);color:#d8dcea;padding:18px 14px;position:sticky;top:0;height:100vh;z-index:10}.brand{font-size:28px;font-weight:900;color:#fff;padding:12px}.org{margin:14px 8px;padding:14px;border:1px solid #ffffff20;border-radius:18px;background:#ffffff0d;font-weight:700}.org small{display:block;color:#aeb6c9;font-weight:400;margin-top:4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d8dcea;text-align:left;padding:13px 15px;border-radius:15px;font-size:16px;font-weight:700;cursor:pointer}.nav button:hover{background:#ffffff10}.nav button.active{color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 12px 28px #7257ff55}.view{width:100%;height:100vh;border:0;background:#f6f6fb}@media(max-width:900px){.app{display:block}.side{height:auto;position:static;padding:8px}.brand,.org{display:inline-block}.nav{display:flex;overflow:auto;gap:6px;padding:5px}.nav button{min-width:max-content}.view{height:calc(100vh - 150px)}}</style><div class="app"><aside class="side"><div class="brand">✦ Reachwell</div><div class="org">Hope Community Outreach<small>Organization details & administration</small></div><nav class="nav" id="menu"></nav></aside><iframe id="view" class="view" src="/full-preview-v4.html" title="Reachwell platform"></iframe></div><script>const items=[['today','Today'],['people','People'],['teams','Teams & Groups'],['communication','Communication'],['events','Events'],['mission','Mission'],['workspace','Workspace'],['finance','Giving & Finance'],['impact','Impact'],['settings','Settings'],['data','Data Center']];const menu=document.getElementById('menu'),frame=document.getElementById('view');menu.innerHTML=items.map(([id,label],i)=>`<button data-id="${id}" class="${i?'':'active'}">${label}</button>`).join('');function select(id){menu.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));try{frame.contentWindow.go(id)}catch(e){frame.src='/full-preview-v4.html'}}menu.addEventListener('click',e=>{let b=e.target.closest('button');if(b)select(b.dataset.id)});frame.addEventListener('load',()=>{try{let d=frame.contentDocument;d.querySelector('.side').style.display='none';d.querySelector('.app').style.gridTemplateColumns='1fr'}catch(e){}});</script></html>
