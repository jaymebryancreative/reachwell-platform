<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reachwell — Foundation Build Preview</title><style>:root{--p:#7257ff;--p2:#a855f7;--pink:#ef7fd5;--ink:#111827}*{box-sizing:border-box}body{margin:0;font:16px/1.45 Inter,system-ui,sans-serif;background:radial-gradient(circle at 95% 0,#eee9ff,transparent 28%),#f6f6fb;color:var(--ink)}.app{min-height:100vh;display:grid;grid-template-columns:286px 1fr}.side{background:linear-gradient(180deg,#101728,#18213a 62%,#30255f);color:#d8dcea;padding:18px 14px;position:sticky;top:0;height:100vh;z-index:20}.brand{font-size:29px;font-weight:900;color:#fff;padding:10px 12px}.tag{font-size:12px;color:#bcb4ff;padding:0 12px 14px}.org{margin:6px 8px 16px;padding:15px;border:1px solid #ffffff20;border-radius:20px;background:linear-gradient(135deg,#ffffff12,#ffffff08);font-weight:800;cursor:pointer}.org small{display:block;color:#b7bfd0;font-weight:500;margin-top:4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d8dcea;text-align:left;padding:14px 16px;border-radius:16px;font-size:16px;font-weight:750;cursor:pointer}.nav button:hover{background:#ffffff10}.nav button.active{color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 12px 28px #7257ff55}.main{min-width:0;display:flex;flex-direction:column}.top{height:78px;background:#fffffff0;backdrop-filter:blur(16px);border-bottom:1px solid #e5e5ee;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 28px;position:sticky;top:0;z-index:10}.crumb{font-weight:900;font-size:18px}.modebar{display:flex;gap:10px;flex-wrap:wrap}.switch{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#fff;border:1px solid #e5ddff;border-radius:999px;font-weight:850;box-shadow:0 5px 18px #1118270b}.switch input{appearance:none;width:44px;height:24px;border-radius:99px;background:#cfd3dc;position:relative;cursor:pointer}.switch input:before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 4px #0003}.switch input:checked{background:linear-gradient(90deg,var(--p),var(--p2))}.switch input:checked:before{left:23px}.foundation{display:flex;gap:8px;overflow:auto;padding:10px 20px;background:#fbfaff;border-bottom:1px solid #ebe8f3}.foundation button{white-space:nowrap;border:1px solid #e1dcf0;background:#fff;border-radius:14px;padding:9px 12px;font-weight:750;color:#403a62;cursor:pointer}.foundation button:hover{border-color:#9f8eff;background:#f6f3ff}.view{flex:1;width:100%;border:0;background:#f6f6fb;min-height:0}@media(max-width:900px){.app{display:block}.side{height:auto;position:static;padding:8px}.brand,.tag,.org{display:none}.nav{display:flex;overflow:auto;gap:6px;padding:4px}.nav button{min-width:max-content;padding:11px 14px}.top{padding:9px 14px;height:auto;align-items:flex-start}.crumb{display:none}.foundation{padding:8px 10px}.view{height:calc(100vh - 168px)}}</style><div class="app"><aside class="side"><div class="brand">✦ Reachwell</div><div class="tag">Connected nonprofit & outreach workspace</div><div class="org" id="org"><span>Hope Community Outreach</span><small>Organization details & administration</small></div><nav class="nav" id="menu"></nav></aside><main class="main"><header class="top"><div class="crumb" id="crumb">Today</div><div class="modebar"><label class="switch">Mission Mode <input id="mission" type="checkbox"></label><label class="switch">Sign-In Mode <input id="signin" type="checkbox"></label></div></header><div class="foundation"><button onclick="selectPage('people')">👤 People & Profiles</button><button onclick="selectPage('teams')">👥 Teams & Roles</button><button onclick="selectPage('communication')">💬 Team Communication</button><button onclick="selectPage('events')">📅 Events & Scheduling</button><button onclick="selectPage('workspace')">✓ Connected Workspace</button></div><iframe id="view" class="view" src="/full-preview-v4.html" title="Reachwell functional platform preview"></iframe></main></div><script>const items=[['today','Today'],['people','People'],['teams','Teams & Groups'],['communication','Communication'],['events','Events'],['mission','Mission'],['workspace','Workspace'],['finance','Giving & Finance'],['impact','Impact'],['settings','Settings'],['data','Data Center']];const menu=document.getElementById('menu'),frame=document.getElementById('view'),crumb=document.getElementById('crumb'),mission=document.getElementById('mission'),signin=document.getElementById('signin');let ready=false;menu.innerHTML=items.map(([id,label],i)=>`<button data-id="${id}" class="${i?'':'active'}">${label}</button>`).join('');function call(fn,arg){try{if(!ready)return false;frame.contentWindow[fn](arg);return true}catch(e){return false}}function selectPage(id){const label=items.find(x=>x[0]===id)?.[1]||id;crumb.textContent=label;menu.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));call('go',id)}window.selectPage=selectPage;menu.addEventListener('click',e=>{const b=e.target.closest('button');if(b)selectPage(b.dataset.id)});document.getElementById('org').onclick=()=>{crumb.textContent='Organization';call('go','organization')};mission.onchange=()=>{if(mission.checked){signin.checked=false;crumb.textContent='Mission Mode';call('go','mission');setTimeout(()=>{try{frame.contentDocument.getElementById('missionToggle').checked=true;frame.contentDocument.getElementById('signinToggle').checked=false;frame.contentWindow.missionToggle?.dispatchEvent(new Event('change'))}catch(e){}},50)}else selectPage('today')};signin.onchange=()=>{if(signin.checked){mission.checked=false;crumb.textContent='Sign-In Mode';try{frame.contentDocument.getElementById('missionToggle').checked=false;frame.contentDocument.getElementById('signinToggle').checked=true;frame.contentWindow.go('signin')}catch(e){call('go','signin')}}else selectPage('today')};frame.addEventListener('load',()=>{ready=true;try{const d=frame.contentDocument;d.querySelector('.side').style.display='none';d.querySelector('.app').style.gridTemplateColumns='1fr';const top=d.querySelector('.top');if(top)top.style.display='none'}catch(e){}});</script></html>
